<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpEdE — Splat Edit Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #ECEBE6; --paper-2: #E0DFD9; --paper-3: #D3D2CB; --ink: #141414; --ink-2: #4A4A47; --muted: #7C7B76;
  --red: #D7263D; --yellow: #F4B400; --blue: #1B4F9C; --line: #141414; --good: #1F7A4D; --bad: #D7263D;
  --display: "Jost", "Futura", "Century Gothic", sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --rail: 68px; --bar: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151617; --paper-2: #1F2022; --paper-3: #2A2B2E; --ink: #ECEBE6; --ink-2: #BDBCB6; --muted: #86857F;
    --red: #EE4257; --yellow: #F6C231; --blue: #5B8BDB; --line: #ECEBE6; --good: #4CC38A; --bad: #EE4257;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151617; --paper-2: #1F2022; --paper-3: #2A2B2E; --ink: #ECEBE6; --ink-2: #BDBCB6; --muted: #86857F;
  --red: #EE4257; --yellow: #F6C231; --blue: #5B8BDB; --line: #ECEBE6; --good: #4CC38A; --bad: #EE4257;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
img { max-width: 100%; display: block; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 700 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) auto; grid-template-rows: var(--bar) minmax(0, 1fr) auto; height: 100%; }
header.top { grid-column: 1 / -1; display: flex; align-items: stretch; border-bottom: 3px solid var(--line); min-width: 0; }
.brand { width: var(--rail); display: grid; place-items: center; border-right: 3px solid var(--line); flex: none; }
.brand svg { width: 38px; height: 38px; }
.projtitle { display: flex; align-items: center; gap: 14px; padding-inline: 18px; min-width: 0; }
.projtitle b { font: 800 16px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
.projtitle span { font: 400 12px/1.2 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbtn { border: 0; border-left: 3px solid var(--line); background: none; cursor: pointer; padding: 0 18px;
  font: 700 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.topbtn:hover { background: var(--paper-2); }
.topbtn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.spacer { flex: 1; }
.jobchip { display: flex; align-items: center; gap: 10px; padding-inline: 18px; border-left: 3px solid var(--line); font: 500 12px/1 var(--mono); white-space: nowrap; }
.jobchip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.jobchip.busy .dot { background: var(--yellow); animation: pulse 1.2s ease-in-out infinite; }
.jobchip.fail .dot { background: var(--red); }
.jobchip.down .dot { background: var(--red); }
@keyframes pulse { 50% { transform: scale(.5); } }

/* ---------- tool rail ---------- */
nav.rail { border-right: 3px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
.tool { position: relative; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 22%, transparent); background: none;
  height: 68px; width: 100%; cursor: pointer; display: grid; place-items: center; }
.tool svg { width: 30px; height: 30px; }
.tool:hover { background: var(--paper-2); }
.tool[aria-pressed="true"] { background: var(--ink); }
.tool[aria-pressed="true"] svg * { stroke: var(--paper); }
.tool[aria-pressed="true"] svg .fill-ink { fill: var(--paper); }
.tool[aria-disabled="true"] { opacity: .28; cursor: not-allowed; }
#tip { position: fixed; z-index: 100; max-width: 260px; background: var(--ink); color: var(--paper); padding: 8px 10px 7px;
  font: 500 12px/1.35 var(--body); pointer-events: none; box-shadow: 4px 4px 0 var(--red); }
#tip b { display: block; font: 800 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; }
.tool .done { position: absolute; right: 9px; top: 9px; width: 8px; height: 8px; background: var(--good); border-radius: 50%; }

/* ---------- stage ---------- */
main.stage { min-width: 0; min-height: 0; overflow-y: auto; padding-inline: clamp(16px, 3vw, 36px); padding-block: 24px 40px; }
.stagehead { display: flex; justify-content: space-between; align-items: end; gap: 18px; flex-wrap: wrap; }
.stagehead h1 { margin: 4px 0 0; font: 800 clamp(30px, 4.4vw, 56px)/.95 var(--display); text-transform: uppercase; text-wrap: balance; }
.stagehead p { margin: 10px 0 0; color: var(--ink-2); max-width: 62ch; }
.canvaswrap { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 24px; align-items: start; }
.canvas { position: relative; border: 3px solid var(--line); background: #0d0e10; aspect-ratio: 1; max-height: calc(100vh - 290px); width: 100%; max-width: calc(100vh - 290px); justify-self: center; }
.canvas.wide { aspect-ratio: 16 / 9; max-width: none; }
.canvas img, .canvas canvas, .canvas iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border: 0; }
.canvas .clicks { cursor: crosshair; }
.canvas .badge { position: absolute; left: 10px; top: 10px; z-index: 3; background: var(--paper); color: var(--ink);
  font: 700 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; padding: 7px 9px 6px; }
.canvas .wait { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(13, 14, 16, .72); color: #ECEBE6; z-index: 4;
  text-align: center; font: 500 14px/1.5 var(--display); letter-spacing: .06em; }
.canvas .wait svg { width: 64px; height: 64px; margin: 0 auto 12px; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.side { display: grid; gap: 16px; align-content: start; }
.card { border: 3px solid var(--line); padding: 16px; display: grid; gap: 12px; }
.card h3 { margin: 0; font: 800 14px/1.1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.card p { margin: 0; font-size: 13px; color: var(--ink-2); }
.field { display: grid; gap: 6px; }
.field label { font: 700 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
.field input[type=text] { border: 3px solid var(--line); background: var(--paper); padding: 10px 11px; font-size: 15px; width: 100%; }
.field .hint, .hint { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 3px solid var(--line); flex-wrap: nowrap; max-width: 100%; }
.seg button { border: 0; border-left: 3px solid var(--line); background: none; padding: 8px 12px 7px; cursor: pointer;
  font: 700 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { border: 0; padding: 14px 18px 13px; cursor: pointer; font: 800 13px/1 var(--display); letter-spacing: .16em; text-transform: uppercase;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
.btn.primary { background: var(--red); color: #fff; }
.btn.primary:hover { background: var(--ink); color: var(--paper); }
.btn.secondary { background: none; border: 3px solid var(--line); padding: 11px 16px 10px; color: var(--ink); }
.btn.secondary:hover { background: var(--paper-2); }
.btn.blue { background: var(--blue); color: #fff; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice button { border: 3px solid var(--line); background: var(--paper); cursor: pointer; padding: 14px 12px; text-align: left; display: grid; gap: 8px; }
.choice button svg { width: 34px; height: 34px; }
.choice button b { font: 800 14px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.choice button:disabled { opacity: .45; cursor: wait; }
.choice button span { font-size: 12px; color: var(--ink-2); }
.choice button:hover { background: var(--paper-2); }
.msg { font-size: 13px; color: var(--ink-2); min-height: 1.5em; }
.msg.err { color: var(--bad); }

/* ---------- stepper ---------- */
footer.steps { grid-column: 2 / 3; border-top: 3px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.step { border: 0; border-left: 3px solid var(--line); background: none; padding: 10px 12px 9px; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: center; cursor: pointer; min-width: 0; }
.step:first-child { border-left: 0; }
.step svg { width: 26px; height: 26px; }
.step > span:first-child { grid-row: span 2; display: grid; }
.step > span:last-child { grid-column: 2; min-width: 0; }
.step b em { font-style: normal; }
.step b { font: 800 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step span { font: 400 11px/1.2 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.now { background: var(--yellow); color: #141414; }
.step.now span { color: #141414; }
.step.done b::after { content: " ✓"; color: var(--good); }
.step[aria-disabled="true"] { cursor: default; opacity: .55; }

/* ---------- drawer ---------- */
aside.drawer { grid-row: 2 / 4; grid-column: 3; border-left: 3px solid var(--line); width: 360px; overflow-y: auto; background: var(--paper); }
aside.drawer .dhead { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 3px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 2; }
aside.drawer .dhead b { font: 800 13px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
.x { border: 0; background: none; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; }
.x svg { width: 16px; height: 16px; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li button { width: 100%; display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; border: 0; background: none; padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 20%, transparent); }
.plist li button:hover { background: var(--paper-2); }
.plist li button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.plist img, .plist .ph { width: 52px; height: 40px; object-fit: cover; background: var(--paper-2); }
.plist .t { display: block; font: 600 13px/1.25 var(--body); overflow-wrap: anywhere; }
.plist .m { display: block; }
.ptoggle { border: 0; background: none; cursor: pointer; padding: 10px 16px 14px; font: 500 12px/1.3 var(--mono); color: var(--muted); text-decoration: underline; text-align: left; }
.plist .m { font: 400 11px/1.3 var(--mono); color: var(--muted); }
.plist li button[aria-current="true"] .m { color: color-mix(in srgb, var(--paper) 70%, transparent); }
.dsec { padding: 14px 16px; border-bottom: 3px solid var(--line); display: grid; gap: 10px; }
.newgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.newgrid button { border: 3px solid var(--line); background: var(--paper); padding: 0; cursor: pointer; text-align: left; }
.newgrid button[aria-pressed="true"] { outline: 5px solid var(--red); outline-offset: -3px; }
.newgrid img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.newgrid b { display: block; padding: 7px 8px 6px; font: 800 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; border-top: 3px solid var(--line); }

/* ---------- gallery, metrics ---------- */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; align-content: start; }
figure { margin: 0; }
figure img { width: 100%; background: var(--paper-2); border: 2px solid var(--line); cursor: zoom-in; }
figcaption { font: 400 11px/1.35 var(--mono); color: var(--muted); margin-top: 5px; }
dl.metrics { margin: 0; display: grid; grid-template-columns: auto 1fr; border-top: 2px solid var(--line); align-content: start; }
dl.metrics dt, dl.metrics dd { margin: 0; padding: 7px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 20%, transparent); }
dl.metrics dt { font: 500 12px/1.3 var(--body); color: var(--ink-2); padding-right: 12px; }
dl.metrics dd { font: 500 12.5px/1.3 var(--mono); text-align: right; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; font: 700 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px 5px; }
.pill.ok { background: var(--good); color: #fff; } .pill.no { background: var(--bad); color: #fff; } .pill.neutral { background: var(--paper-2); }
.empty { color: var(--muted); font-size: 13px; }

details.more { border-top: 2px solid var(--line); padding-top: 2px; }
details.more > summary { cursor: pointer; font: 700 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; padding: 9px 0 7px; color: var(--ink-2); }
details.more[open] > summary { margin-bottom: 6px; }
details.more > * + * { margin-top: 8px; }
.brand { cursor: pointer; }
dialog.lb { border: 3px solid var(--line); padding: 0; background: var(--paper); max-width: 94vw; max-height: 92vh; }
dialog.lb img { max-width: 92vw; max-height: 84vh; width: auto; cursor: zoom-out; }
dialog.lb::backdrop { background: rgba(10, 10, 10, .78); }
dialog.lb p { margin: 0; padding: 8px 12px; font: 400 12px/1.3 var(--mono); border-top: 3px solid var(--line); }

/* ---------- banner: the last failure ---------- */
.banner { margin-top: 18px; border: 3px solid var(--red); background: var(--paper-2); padding: 12px 14px; display: flex; gap: 16px;
  justify-content: space-between; align-items: start; flex-wrap: wrap; }
.banner b { display: block; font: 800 13px/1.3 var(--display); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.banner pre { margin: 0; white-space: pre-wrap; font: 400 12px/1.4 var(--mono); max-width: 90ch; color: var(--ink-2); }
.banner .row { display: flex; gap: 8px; flex: none; }

/* ---------- main area: result · cameras ---------- */
.vtabs { display: flex; border: 3px solid var(--line); border-bottom: 0; width: fit-content; max-width: 100%; }
.vtabs button { border: 0; border-right: 3px solid var(--line); background: var(--paper); color: var(--ink); font: 800 11px/1 var(--display);
  letter-spacing: .14em; text-transform: uppercase; padding: 9px 14px 8px; cursor: pointer; }
.vtabs button:last-child { border-right: 0; }
.vtabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.vtabs button:disabled { opacity: .35; cursor: default; }
.mainarea { min-width: 0; display: grid; align-content: start; }
.mainarea .canvas { justify-self: start; }
.campanel { position: relative; border: 3px solid var(--line); background: var(--paper-2); padding: 12px; display: grid; gap: 12px; align-content: start; }
.campanel .wait { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(13, 14, 16, .72); color: #ECEBE6; z-index: 4;
  font: 700 14px/1.4 var(--display); letter-spacing: .1em; text-transform: uppercase; text-align: center; }
.campanel .wait svg { width: 64px; height: 64px; margin: 0 auto 12px; animation: spin 2.4s linear infinite; }
.filmstrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.filmstrip button { flex: none; width: 96px; border: 3px solid transparent; padding: 0; background: none; cursor: pointer; position: relative; text-align: left; }
.filmstrip button[aria-pressed="true"] { border-color: var(--red); }
.filmstrip img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.filmstrip .cap { display: block; font: 500 10px/1.2 var(--mono); padding: 3px 2px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filmstrip .vis { position: absolute; left: 3px; bottom: 22px; background: rgba(0, 0, 0, .72); color: #fff; font: 700 10px/1 var(--display); letter-spacing: .06em; padding: 3px 4px; }
.filmstrip .hero { position: absolute; left: 3px; top: 3px; background: var(--yellow); color: #141414; font: 800 9px/1 var(--display); letter-spacing: .1em; padding: 3px 4px; }
.filmstrip .flag { position: absolute; right: 4px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
.bigstrip { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.bigstrip img { width: 100%; aspect-ratio: 1; background: #0d0e10; display: block; cursor: zoom-in; object-fit: contain; }
.bigstrip figcaption { font: 700 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 6px 0 0; }
.status { display: grid; gap: 6px; font: 500 12.5px/1.4 var(--mono); }
.status i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: var(--muted); }
.status .on i { background: var(--good); } .status .off i { background: var(--bad); }

@media (max-width: 1100px) {
  .canvaswrap { grid-template-columns: minmax(0, 1fr); }
  aside.drawer { position: fixed; right: 0; top: var(--bar); bottom: 0; z-index: 25; width: min(360px, 100vw); box-shadow: -12px 0 0 rgba(0,0,0,.08); }
}
@media (max-width: 720px) {
  :root { --rail: 54px; }
  .tool { height: 54px; } .tool svg { width: 24px; height: 24px; }
  .projtitle span, .topbtn .lbl { display: none; }
  .jobchip { padding-inline: 10px; gap: 6px; }
  .jobchip .txt { max-width: 72px; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .step { grid-template-columns: 26px auto; justify-content: center; padding-inline: 6px; }
  .step b em, .step > span:last-child { display: none; }
  .step > span:first-child { grid-row: auto; }
  .canvas { max-height: none; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brand" role="button" tabindex="0" aria-label="Start page" data-tip="SpEdE|Splat Edit Engine: select an object in a Gaussian-splat scene, extract it, remove it and patch the surface it hid, or replace it. Runs in your local ComfyUI. Click for the start page.">
      <svg viewBox="0 0 38 38" aria-hidden="true"><rect x="1" y="1" width="36" height="36" fill="var(--blue)"/><circle cx="19" cy="19" r="12" fill="var(--red)"/><polygon points="19,11 27,26 11,26" fill="var(--yellow)"/></svg>
    </div>
    <div class="projtitle"><b>SpEdE</b><span id="ptitle">Splat Edit Engine</span></div>
    <div class="spacer"></div>
    <button class="topbtn" id="btn-projects" type="button" data-tip="Projects|Start a new edit or reopen one." aria-expanded="false" aria-controls="drawer-projects">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="2" width="16" height="3" fill="currentColor"/><rect x="1" y="7.5" width="16" height="3" fill="currentColor"/><rect x="1" y="13" width="16" height="3" fill="currentColor"/></svg>
      <span class="lbl">Projects</span></button>
    <div class="jobchip" id="jobchip" data-tip="ComfyUI queue|One job runs at a time. Yellow: working · red: the last job failed or ComfyUI is down."><span class="dot"></span><span class="txt">Idle</span></div>
    <button class="topbtn" id="theme" type="button" aria-label="Toggle dark mode" data-tip="Theme|Switch between light and dark.">
      <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11 2a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>

  <main class="stage" id="stage"></main>

  <aside class="drawer" id="drawer-projects" hidden aria-label="Projects">
    <div class="dhead"><b>Projects</b><button class="x" type="button" id="close-projects" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M2 2L14 14M14 2L2 14" stroke="var(--ink)" stroke-width="2.5"/></svg></button></div>
    <div class="dsec">
      <span class="eyebrow">New edit</span>
      <div class="newgrid" id="newscenes"></div>
      <div class="field"><label for="newtitle">Name</label><input type="text" id="newtitle" value="" autocomplete="off"></div>
      <button class="btn primary" type="button" id="create">Start editing</button>
      <div class="msg" id="createmsg"></div>
    </div>
    <div class="dsec" style="padding-bottom:6px"><span class="eyebrow">Projects</span></div>
    <ul class="plist" id="plist"></ul>
  </aside>

  <footer class="steps" id="steps"></footer>
</div>
<div id="tip" role="tooltip" hidden></div>
<dialog class="lb" id="lb"><img id="lbimg" alt=""><p id="lbcap"></p></dialog>

<script>
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));

function nameField(msg, primary = false) {

          (c ? 'Remove again' : 'Remove and patch') + (r ? ' (discards the replacement)' : '')),

function stageResult() {
  const c = P.comfy, r = P.replace, a = P.allround;

    c || r ? h('iframe', { src: '/compare.html?run=' + P.name + '&g=' + Math.round(r?.finished || a?.finished || c?.finished || 0) + latest + '&v=' + PAGES, title: '3D compare' })
      : h('span', { class: 'badge' }, 'Nothing edited yet'), waitOverlay(P.job));
  const drag = ' Drag either side: both views move together; Space switches A/B.';
  // One primary download: the newest result; the others under More downloads.
  const downloads = [r && P.files.replace_ply ? ['Download replaced scene (PLY)', P.files.replace_ply, 'replaced_scene.ply'] : null,
    a && P.files.allround_ply ? ['Download all-around scene (PLY)', P.files.allround_ply, 'allround_scene.ply'] : null,

      c || r ? replaceCard() : null,

      h('div', { class: 'card' }, h('h3', {}, 'Next object'),
        h('p', {}, ANOTHER_HINT), anotherButton('btn primary')),
      c ? h('div', { class: 'card' }, h('h3', {}, 'Pictures'), h('div', { class: 'gallery' },
        fig(P.files.comfy_qwen_edit, 'Qwen-Image 2.1 repair · edit camera'),

                          fig(P.files.allround_warp, 'Edit camera warped along the orbit (experimental orbit path)'),
                          fig(P.files.allround_result, 'All-around fill · clean target | render, chain cameras')]
          : a ? [fig(P.files.allround_sheet, 'All-around fill · clean target | render, per camera'),
                 fig(P.files.allround_hero_clean, 'Qwen-Image 2.1 clean edit camera at 1024 px')] : []))) : null))];
}
// The hero patch is right in one camera; the all-around fill makes it hold from every direction.
// Results written before the progressive fill carry no method but an orbit chain (allround_mode orbit).
const isOrbit = a => !!a && (a.method === 'orbit' || (!a.method && !!a.chain));
function allroundCard() {
  const a = P.allround, msg = h('div', { class: 'msg' });
  const depth = P.comfy?.patch_mode === 'depthfill';
  let rows = [];
  if (isOrbit(a)) {
    // The experimental MiniMax H3 orbit path keeps its own numbers.
    const held = (a.held_out || []).map(v => a.after?.[v]).filter(Boolean);
    rows = [['Chain cameras', fmt((a.cameras || a.chain || []).length, 0)], ['Orbit frames used', `${fmt(a.usable_frames, 0)} / ${fmt(a.orbit_frames, 0)}`],
            ['Splats optimised', fmt(a.trainable, 0)], ['Drifted, pruned', fmt(a.pruned_drifted, 0)],
            ['Scene splats now', fmt(a.total_gaussians, 0)],
            ...(held.length ? [['Held-out cameras, RGB error', held.map(r => fmt(r.mae, 3)).join(' · ')]] : []),
            ['ComfyUI job', a.comfy_job?.slice(0, 8)]];
  } else if (a) {
    // Measured against the cleaned targets: the fill holds no camera out. The independent fill has no births.
    const errs = Object.values(a.after || {}).map(r => r?.mae).filter(v => typeof v === 'number');
    const hero = a.after?.[(a.cameras || [])[0]]?.mae;
    rows = [['Cameras cleaned', fmt(a.cameras_filled, 0)], ['Support discs', fmt(a.surface_discs, 0)],
            ...(a.method === 'independent' ? [] : [['New splats', fmt(a.births, 0)]]), ['Scene splats now', fmt(a.total_gaussians, 0)],
            ['Fit to the cleaned cameras (edit camera / mean RGB error)', errs.length ? `${fmt(hero, 3)} / ${fmt(errs.reduce((x, y) => x + y, 0) / errs.length, 3)}` : null],
            ['ComfyUI job', a.comfy_job?.slice(0, 8)]];
  }
  // After a Replace the fill would rebuild the scene without the new object: not offered.
  const blocked = P.replace ? 'The all-around fill isn\'t available after Replace. To get both: Remove again, run the all-around fill, then Replace.'
    : !depth ? 'The all-around fill builds on the depth fill; this result used the planar fallback.' : null;
  return h('div', { class: 'card' }, h('h3', {}, 'All-around fill'),
    a ? h('p', {}, `Done: ${fmt(a.cameras_filled ?? (a.cameras || a.chain || []).length, 0)} cameras cleaned. The 3D view shows the all-around result.`)
      : h('p', {}, 'The patch is right from the edit camera. The all-around fill cleans every camera that sees the hole (Qwen-Image 2.1 turbo) and fits the patch to all of them, so it holds from every direction. About 10 minutes.'),
    blocked ? h('p', { class: 'hint' }, blocked)
      : h('button', { class: a ? 'btn secondary' : 'btn primary', type: 'button', disabled: !!P.job, onclick: async () => {

    a ? more('Details', metrics(rows)) : null, msg);
}
// Replace: a new object where the selected one stands, straight after the selection (into the original

// The typed words, the picture and the size survive re-renders (REPLACE_DRAFT, per project).
const REPLACE_DRAFT = {};
const SIZE_TEXT = { match: 'Match', natural: 'Natural', larger: 'Larger' };

  const r = P.replace, msg = h('div', { class: 'msg' }), what = P.label || 'object';

  const file = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', hidden: true, onchange: async e => {

      draft.image = (await api(`/api/projects/${P.name}/replace_image`, { data })).image; renderStage();
    } catch (err) { fail(err); } } });
  const pl = r?.placement || {};

    h('p', {}, `Put something new where the ${what} ${P.comfy ? 'stood' : 'stands'}. Qwen-Image 2.1 draws it into the edit camera's view, TripoSplat makes it 3D, and SpEdE stands it where the old one stood. About a minute${P.extract ? '' : ', a few more the first time'}.`),
    h('p', { class: 'hint' }, 'TripoSplat invents the back side, so the new object looks best within about ±15° of the edit camera. One replacement per project.'),
    h('div', { class: 'field' }, h('label', {}, 'What to put there'), input),

    h('p', { class: 'hint' }, 'Match: as big as the old object. Natural: the size Qwen draws. Larger: 1.3 × Match.'),

    draft.image ? h('div', { class: 'gallery' }, fig(`/files/${P.name}/replace_inputs/${draft.image}`, 'Look like this picture')) : null,
    go,

    r ? h('div', { class: 'gallery' }, fig(P.files.replace_qwen, 'Qwen-Image 2.1 insert · edit camera'),
                                       fig(P.files.replace_render, 'Replaced scene in 3D · edit camera')) : null,
    r ? more('Details', metrics([['New object splats', fmt(r.object_gaussians, 0)],
                 ['Size', SIZE_TEXT[r.size] || null],
                 ['Height vs the removed object', pl.height_vs_removed != null ? `${fmt(pl.height_vs_removed, 2)}×` + (pl.height_natural_vs_removed != null && r.size !== 'natural' ? ` (Qwen drew ${fmt(pl.height_natural_vs_removed, 2)}×)` : '') : null],
                 ['Moved from the old spot', pl.shift_fraction != null ? `${fmt(100 * pl.shift_fraction, 0)} % of its size${pl.shift_capped ? ' (capped)' : ''}` : null],
                 ['Built on', r.base === 'remove' ? 'the Remove result' : r.base === 'source' ? 'the original scene' : null],
                 ['Old footprint filled', r.fill_fraction != null ? `${fmt(100 * r.fill_fraction, 0)} % · ${r.fill_source === 'plane' ? 'from the surface round it' : 'from the Remove fill'}` : null],
                 ['ComfyUI job', r.comfy_job?.slice(0, 8)]])) : null,

/* ---------- projects drawer ---------- */
function toggleDrawer(open) {
  const d = $('#drawer-projects'); const want = open ?? d.hidden;
  d.hidden = !want; $('#btn-projects').setAttribute('aria-expanded', String(want));
  if (want) renderDrawer();
}
$('#btn-projects').onclick = () => toggleDrawer();
$('#close-projects').onclick = () => toggleDrawer(false);
async function renderDrawer() {
  const keys = Object.keys(SCENES);
  if (!NEW.scene && keys.length) { NEW.scene = keys[0]; $('#newtitle').value = `${SCENES[keys[0]].title} edit`; }
  $('#newscenes').replaceChildren(...keys.map(k => h('button', { type: 'button', 'aria-pressed': String(NEW.scene === k), onclick: () => { NEW.scene = k; $('#newtitle').value = `${SCENES[k].title} edit`; renderDrawer(); } },
    h('img', { src: `/api/scenes/${k}/camera/${SCENES[k].hero}.png`, alt: SCENES[k].title }), h('b', {}, SCENES[k].title))));
  if (!NEW.scene) {
    $('#newscenes').replaceChildren(h('p', { class: 'empty' }, 'No scenes configured: add them to config.json (see config.example.json).'));
  }
  // Development and verification runs stay on disk but out of the list unless asked for (the open one always shows).
  const tests = PROJECTS.filter(isTestRun), shown = PROJECTS.filter(p => SHOW_TESTS || !isTestRun(p) || P?.name === p.name);
  const when = p => p.created ? new Date(p.created * 1000).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('#plist').replaceChildren(...(shown.length ? shown.map(p => h('li', {}, h('button', { type: 'button', 'aria-current': String(P?.name === p.name), onclick: () => { openProject(p.name); toggleDrawer(false); } },
    h('img', { src: `/api/scenes/${p.scene}/camera/${p.view}.png`, alt: '' }),
    h('span', {}, h('span', { class: 't' }, p.title),
      h('span', { class: 'm' }, [SCENES[p.scene]?.title || p.scene, p.label || 'nothing selected', STAGE_TEXT[p.stage] || p.stage, when(p)].filter(Boolean).join(' · ')))))) : [h('li', { class: 'dsec empty' }, 'No projects yet.')]),
    ...(tests.length ? [h('li', {}, h('button', { class: 'ptoggle', type: 'button', onclick: () => { SHOW_TESTS = !SHOW_TESTS; renderDrawer(); } },
      SHOW_TESTS ? 'Hide test runs' : `Show test runs (${tests.length})`))] : []));
}
let SHOW_TESTS = false;
const isTestRun = p => /verify|spike|_v\d+_|^studio_/i.test(p.name) || /^(verify|test)\b/i.test(p.title || '');
$('#create').onclick = async () => {
  if (!NEW.scene) return;
  const msg = $('#createmsg'); msg.textContent = ''; msg.className = 'msg';
  try {
    // The scene only: the project starts at its hero camera and opens in 3D, where the object is picked.
    const p = await api('/api/projects', { scene: NEW.scene, title: $('#newtitle').value.trim() || null });
    PROJECTS = await api('/api/projects'); toggleDrawer(false); POINTS = []; await openProject(p.name); setTool('select');
  } catch (e) { msg.textContent = e.message; msg.className = 'msg err'; }
};

/* ---------- project state ---------- */
async function openProject(name) {
  P = await api('/api/projects/' + name);
  if (!CAMS[P.scene]) CAMS[P.scene] = await api(`/api/scenes/${P.scene}/cameras`);
  $('#ptitle').textContent = `${P.title} · ${P.scene} · camera ${P.view}`;
  try { localStorage.setItem('spede-project', name); } catch (e) {}
  // Nothing from the previous project carries over.
  POINTS = []; SELVIEW = null; VIEWTAB = null; CAMPICK = null; JOB_TOOL = null; BANNER = null;
  try {   // the last job of this project, if it did not finish, is still worth seeing
    const last = (await api('/api/jobs')).find(j => j.name === name);
    if (last && ['failed', 'interrupted', 'cancelled'].includes(last.status)) BANNER = last;
  } catch (e) {}
  // A hero check waiting for the user's choice keeps them on Select (the check), a result opens on Result.
  TOOL = defaultTool();
  // The last thing done was an extract: open on it.
  if (!heroWaiting() && !P.job && latestIsExtract()) { TOOL = 'select'; SELVIEW = 'extract'; }
  JOB_TOOL = P.job ? TOOL : null;   // reloaded during a job: its end still opens the next step
  renderRail(); renderStage(); TOP();
}
async function refresh() {
  if (!P) return;
  P = await api('/api/projects/' + P.name);
  $('#ptitle').textContent = `${P.title} · ${P.scene} · camera ${P.view}`;
  renderRail(); renderStage();
}
async function pollJobs() {
  let jobs = [];
  try { jobs = await api('/api/jobs'); } catch (e) { return; }
  // The chip speaks for the open project only (every project's jobs when none is open).
  const mine = P ? jobs.filter(j => j.name === P.name) : jobs;
  const running = mine.find(j => j.status === 'running');
  const chip = $('#jobchip');
  const stepName = (running?.steps.find(s => s.status === 'running') || {}).name;
  chip.classList.toggle('busy', !!running);
  chip.classList.toggle('fail', !running && mine[0]?.status === 'failed');
  chip.querySelector('.txt').textContent = running ? `${KIND_TEXT[running.kind] || running.kind} · ${STEP_LABEL[stepName] || stepName || '…'}`
    : mine.some(j => j.status === 'queued') ? 'Queued' : mine[0]?.status === 'failed' ? `${KIND_TEXT[mine[0].kind] || mine[0].kind} failed` : 'Idle';
  if (!P) return;
  const live = j => j.status === 'queued' || j.status === 'running';
  const active = jobs.filter(j => j.name === P.name && live(j));
  if (P.job) {
    const now = jobs.find(x => x.id === P.job.id);
    if (now && live(now)) {
      // Still running: only the overlay changes; the stage (typed text, the 3D view) stays as it is.
      P.job = now;
      document.querySelectorAll('.wait').forEach(el => el.replaceWith(waitOverlay(now)));
      return;
    }
    const finished = now || { ...P.job, status: 'done' };
    await refresh();
    if (['failed', 'interrupted', 'cancelled'].includes(finished.status)) {
      BANNER = finished;
      if (finished.kind === 'pick') SELVIEW = '3d';     // nothing picked: back to where the click was
      renderStage();
    }
    // A new selection is checked before anything is removed.
    if (finished.status === 'done' && SELECTING.has(finished.kind) && TOOL === JOB_TOOL) { SELVIEW = 'confirm'; renderStage(); }
    // A finished extract shows the object, if the user is still where it was started from.
    if (finished.status === 'done' && finished.kind === 'extract' && TOOL === JOB_TOOL && P.files?.extract_ply) {
      TOOL = 'select'; SELVIEW = 'extract'; VIEWTAB = null; renderRail(); renderStage();
    }
    // Open the next step only if the user is still where the job was started from.
    if (finished.status === 'done' && ADVANCING.has(finished.kind) && TOOL === JOB_TOOL && !heroWaiting()) {
      TOOL = defaultTool(); renderRail(); renderStage(); TOP();
    }
    JOB_TOOL = null;
    return;
  }
  if (active.length) { JOB_TOOL = JOB_TOOL || TOOL; refresh(); }   // started from another tab
}
setInterval(pollJobs, 2500);
async function pollStatus() {
  try { STATUS = await api('/api/status'); } catch (e) { STATUS = { comfy: false, sdk: false }; }
  $('#jobchip').classList.toggle('down', !(STATUS.comfy && STATUS.sdk));
  if (!P) renderStage();
}
setInterval(pollStatus, 15000);

/* one floating tooltip for every element with data-tip ("Title|text") */
const tipEl = $('#tip');
function showTip(el) {
  const [t, text] = (el.dataset.tip || '').split('|');
  tipEl.replaceChildren(h('b', {}, t), text || '');
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, hh = tipEl.offsetHeight;
  let x = r.right + 10, y = r.top + r.height / 2 - hh / 2;
  if (x + w > innerWidth - 8) { x = Math.max(8, r.left + r.width / 2 - w / 2); y = r.top - hh - 10; if (y < 8) y = r.bottom + 10; }
  tipEl.style.left = Math.min(x, innerWidth - w - 8) + 'px'; tipEl.style.top = Math.max(8, Math.min(y, innerHeight - hh - 8)) + 'px';
}
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else tipEl.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', () => { tipEl.hidden = true; });
document.addEventListener('scroll', () => { tipEl.hidden = true; }, true);

// The logo leads back to the start page.
const home = () => { P = null; TOOL = 'select'; $('#ptitle').textContent = 'Splat Edit Engine'; renderRail(); renderStage(); TOP(); };
$('#brand').onclick = home;
$('#brand').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); home(); } };
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('spede-theme', document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('spede-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

(async () => {
  [SCENES, PROJECTS] = await Promise.all([api('/api/scenes'), api('/api/projects')]);
  await pollStatus();
  let last = null; try { last = localStorage.getItem('spede-project'); } catch (e) {}
  if (last && PROJECTS.some(p => p.name === last)) await openProject(last);
  else { TOOL = 'select'; renderRail(); renderStage(); }
  pollJobs();
})();
